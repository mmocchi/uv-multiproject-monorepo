# Ruffの基本設定
target-version = "py310"
line-length = 100

# 除外するファイル
exclude = [
  ".git",
  ".ruff_cache",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "D",   # pydocstyle
  "RET", # flake8-return
]

ignore = [
  "D203", # one-blank-line-before-class
  "D212", # multi-line-summary-first-line
  "D415", #
]

[lint.per-file-ignores]
# shared_configの親ディレクトリ（プロジェクトルート）以下のtestsディレクトリ内のPythonファイル
"../**/tests/*.py" = [
  "D",     # docstring関連のすべてのルール
  "E402",  # モジュールレベルのインポート位置
  "F403",  # `from module import *` の使用
  "F405",  # `import *` で導入された未定義名の可能性
  "S101",  # assert文の使用
  "S102",  # exec文の使用
  "PLR",   # pylintのリファクタリング関連
  "N",     # 命名規則
  "ARG",   # 未使用の関数引数
  "F401",  # 未使用のインポート
]

# 共通の__init__.py設定
"../**/__init__.py" = ["E402", "D"]

[lint.pydocstyle]
convention = "google"

[format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
