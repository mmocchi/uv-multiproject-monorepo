repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        args: [src, tests]

      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check
        language: system
        types: [python]
        args: [src, tests]

      - id: mypy
        name: MyPy
        entry: uv run mypy
        language: system
        types: [python]
        args: [src/, tests/]

      - id: import-linter
        name: Import Linter
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: PyTest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false 