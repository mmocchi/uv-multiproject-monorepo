version: '3'

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  lint:
    desc: コードの静的解析を実行 (ruff, mypy)
    cmds:
      - task: lint:ruff
      - task: lint:mypy

  lint:ruff:
    desc: Ruff による静的解析を実行
    cmds:
      - uv run ruff check src tests
    silent: true

  lint:mypy:
    desc: mypy による型チェックを実行
    cmds:
      - uv run mypy src/
      - uv run mypy tests/
    silent: true

  format:
    desc: コードのフォーマットを実行
    cmds:
      - uv run ruff format src tests
    silent: true

  fix:ruff:
    desc: Ruff によるcheckの修正を実行
    cmds:
      - uv run ruff check --fix src tests
    silent: true

  test:
    desc: テストを実行
    cmds:
      - uv run pytest tests
    silent: true

  check:
    desc: すべてのチェック（lint, format, test）を実行
    cmds:
      - task: lint
      - task: format
      - task: test

  watch:
    desc: ファイルの変更を監視して自動的にチェックを実行
    cmds:
      - task: check
    watch: true
