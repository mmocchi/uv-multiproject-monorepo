repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        args: [src, tests]
        stages: [commit, manual]

      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check
        language: system
        types: [python]
        args: [src, tests]
        stages: [commit, manual]

      - id: mypy
        name: MyPy
        entry: uv run mypy
        language: system
        types: [python]
        args: ["--package", "application1"]
        pass_filenames: false
        stages: [commit, manual]
        additional_dependencies: []
        files: ^(src/|tests/)

      - id: pytest
        name: PyTest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        stages: [commit, manual] 