version: '3'

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  setup:hooks:
    desc: pre-commitフックをインストール
    cmds:
      - pre-commit install

  check:all:
    desc: すべてのプロジェクトのチェックを実行
    cmds:
      - cd shared/module1 && task check
      - cd apps/application1 && task check 

  lint:all:
    desc: すべてのプロジェクトのlintを実行
    cmds:
      - cd shared/module1 && task lint
      - cd apps/application1 && task lint 

  format:all:
    desc: すべてのプロジェクトのformatを実行
    cmds:
      - cd shared/module1 && task format
      - cd apps/application1 && task format 
