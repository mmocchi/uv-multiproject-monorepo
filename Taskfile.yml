version: '3'

tasks:
  default:
    desc: タスク一覧を表示
    cmds:
      - task --list
    silent: true

  setup:hooks:
    desc: pre-commitフックをインストール
    cmds:
      - cd shared/module1 && uv pip install -e ".[dev]"
      - cd apps/application1 && uv pip install -e ".[dev]"
      - pre-commit install
    silent: true

  update:hooks:
    desc: pre-commitフックを更新
    cmds:
      - pre-commit autoupdate
    silent: true

  check:all:
    desc: すべてのプロジェクトのチェックを実行
    cmds:
      - cd shared/module1 && task check
      - cd apps/application1 && task check 